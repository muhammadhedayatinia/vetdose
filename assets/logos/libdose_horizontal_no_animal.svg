<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120" width="100%" height="100%">
  <!-- Transparent / Dark Nav Background -->
  <rect width="620" height="120" fill="#07153D" rx="16"/>

  <!-- Left: The Medical Open Book + Capsule Icon (Zero Animals) -->
  <g transform="translate(30, 10) scale(0.25)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Book Pages -->
    <path d="M 200 320 C 160 320 110 300 80 250 C 80 220 100 190 140 205 C 170 215 190 250 200 280" stroke="#00C8F8" stroke-width="14"/>
    <path d="M 200 320 C 240 320 290 300 320 250 C 320 220 300 190 260 205 C 230 215 210 250 200 280" stroke="#00C8F8" stroke-width="14"/>
    
    <!-- Capsule -->
    <rect x="170" y="110" width="60" height="135" rx="30" stroke="#00C8F8" stroke-width="14" fill="#07153D"/>
    <path d="M 170 140 A 30 30 0 0 1 230 140 L 230 175 L 170 175 Z" fill="#00C8F8"/>
    <line x1="166" y1="175" x2="234" y2="175" stroke="#FFFFFF" stroke-width="10"/>
    <line x1="200" y1="192" x2="200" y2="218" stroke="#00C8F8" stroke-width="6"/>
    <line x1="187" y1="205" x2="213" y2="205" stroke="#00C8F8" stroke-width="6"/>
  </g>

  <!-- Divider Line -->
  <line x1="135" y1="28" x2="135" y2="92" stroke="#00C8F8" stroke-width="2" opacity="0.4"/>

  <!-- Right: Typography Group -->
  <!-- Brand Name: LIB in White, DOSE in Cyan -->
  <text x="155" y="62" font-family="'Segoe UI', 'Montserrat', sans-serif" font-weight="900" font-size="38" letter-spacing="3">
    <tspan fill="#FFFFFF">LIB</tspan><tspan fill="#00C8F8">DOSE</tspan>
  </text>

  <!-- Persian Subtitle -->
  <text x="155" y="88" fill="#D6F4FC" opacity="0.9" font-family="'Vazirmatn', 'Dana', 'Tahoma', sans-serif" font-weight="600" font-size="16">دارونامه و دوزبندی دامپزشکی • خانواده LibVet</text>
</svg>
