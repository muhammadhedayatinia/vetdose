<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- App Icon Squircle Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="115" fill="#07153D" stroke="#FA9F0A" stroke-width="8"/>

  <!-- Signature LibVet / LibDose Animal Mark (Clean Minimalist Vector) -->
  <g transform="translate(0, -10)" fill="none" stroke="#FA9F0A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Outer Ear & Head Silhouette -->
    <path d="M 175 270 L 205 125 L 265 210 L 307 125 L 337 270"/>

    <!-- Inner Ear Contour Lines -->
    <path d="M 205 125 L 245 250"/>
    <path d="M 307 125 L 267 250"/>

    <!-- Central Open Book / Forehead Arcs -->
    <path d="M 245 250 Q 256 215 256 240 Q 256 215 267 250"/>

    <!-- Symmetrical Cheeks to Lower Chin -->
    <path d="M 175 270 L 256 375 L 337 270"/>

