<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
  <!-- Transparent / Dark Nav Background -->
  <rect width="600" height="120" fill="#07153D" rx="16"/>

  <!-- Left: The Signature LibVet / LibDose Animal Mark (Scale: 90x90 at X: 25, Y: 15) -->
  <g transform="translate(30, 8) scale(0.24)" fill="none" stroke="#FA9F0A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Ear & Head Silhouette -->
    <path d="M 90 270 L 125 90 L 195 185 L 256 260 L 317 185 L 387 90 L 422 270"/>
    <!-- Inner Ear Contour Lines -->
    <path d="M 125 90 L 175 250"/>
    <path d="M 387 90 L 337 250"/>
    <!-- Central Forehead Open Book Arcs -->
    <path d="M 175 250 Q 215 190 256 225 Q 297 190 337 250"/>
    <!-- Lower Chin -->
    <path d="M 90 270 L 256 420 L 422 270"/>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="165" y1="28" x2="165" y2="92" stroke="#FA9F0A" stroke-width="2.5" opacity="0.4"/>

  <!-- Right: Typography Group -->
  <!-- Brand Name: LibDose -->
  <text x="185" y="62" fill="#FA9F0A" font-family="'Segoe UI', 'Montserrat', sans-serif" font-weight="900" font-size="38" letter-spacing="3">LIBDOSE</text>

  <!-- Persian Subtitle: دارونامه و دوزبندی دامپزشکی -->
  <text x="185" y="88" fill="#FCD34D" opacity="0.9" font-family="'Vazirmatn', 'Dana', 'Tahoma', sans-serif" font-weight="600" font-size="16">دارونامه و دوزبندی دامپزشکی • خانواده LibVet</text>
</svg>
