<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient (Midnight Navy) -->
    <radialGradient id="bannerBg" cx="45%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0B2B5C" />
      <stop offset="45%" stop-color="#061937" />
      <stop offset="85%" stop-color="#030E20" />
      <stop offset="100%" stop-color="#010712" />
    </radialGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="electricCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3BF8FD" />
      <stop offset="60%" stop-color="#19F7FC" />
      <stop offset="100%" stop-color="#00C9E8" />
    </linearGradient>

    <!-- Cyan Glow Aura behind Dose & Emblem -->
    <filter id="neonAura" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Page Glow -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- White Highlights Gradient -->
    <linearGradient id="whiteGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8F9FD" />
    </linearGradient>
  </defs>

  <!-- Deep Navy Canvas -->
  <rect width="1200" height="450" fill="url(#bannerBg)" rx="24" />

  <!-- Ambient Light Spot behind "Dose" text -->
  <circle cx="830" cy="220" r="160" fill="#19F7FC" opacity="0.12" filter="url(#neonAura)" />
  <!-- Ambient Light Spot behind Emblem -->
  <circle cx="250" cy="225" r="140" fill="#19F7FC" opacity="0.14" filter="url(#neonAura)" />

  <!-- ========================================== -->
  <!-- LEFT EMBLEM: REAL OPEN BOOK + CAPSULE + PAW -->
  <!-- ========================================== -->
  <g transform="translate(10, 0)">
    
    <!-- 1. Real Open Hardcover Book (جلد ضخیم با پرسپکتیو واضح + صفحات گشوده) -->
    <g filter="url(#subtleGlow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      
      <!-- Hardcover Base & Spine V-Notch (خط مستقیم زاویه‌دار جلد کتاب - بدون گردی پیاله‌ای) -->
      <!-- چپ: از (110, 260) به (90, 310) و به عطف پایین (250, 355) -->
      <!-- راست: از عطف (250, 355) به گوشه راست (410, 310) و به (390, 260) -->
      <path d="M 110 260 L 90 310 L 250 355 L 410 310 L 390 260" 
            stroke="url(#electricCyan)" stroke-width="12" />

      <!-- خط عمودی اتصال عطف وسط -->
      <line x1="250" y1="355" x2="250" y2="330" stroke="url(#electricCyan)" stroke-width="10" />

      <!-- برگه بالایی کتاب باز سمت چپ (خمیده از عطف به لبه بیرونی) -->
      <path d="M 250 330 C 190 325 140 295 110 260" 
            stroke="url(#electricCyan)" stroke-width="11" />
      <!-- برگه بالایی کتاب باز سمت راست (خمیده از عطف به لبه بیرونی) -->
      <path d="M 250 330 C 310 325 360 295 390 260" 
            stroke="url(#electricCyan)" stroke-width="11" />

      <!-- لایه‌های داخلی اوراق کتاب (سفید درخشان - ضخامت دانشنامه) -->
      <path d="M 250 310 C 195 305 150 280 125 250" stroke="url(#whiteGloss)" stroke-width="8" />
      <path d="M 250 310 C 305 305 350 280 375 250" stroke="url(#whiteGloss)" stroke-width="8" />
      
      <!-- لایه دوم کاغذ -->
      <path d="M 250 295 C 205 290 170 270 145 245" stroke="url(#whiteGloss)" stroke-width="5" opacity="0.8" />
      <path d="M 250 295 C 295 290 330 270 355 245" stroke="url(#whiteGloss)" stroke-width="5" opacity="0.8" />
    </g>

    <!-- 2. Vertical Upright Capsule (Center: X: 250, مستقر در دره مرکزی کتاب) -->
    <!-- Width: 74px, Height: 154px (Y: 135 to 289) -->
    <g filter="url(#subtleGlow)">
      <!-- Capsule Shadow/Backing -->
      <rect x="213" y="135" width="74" height="154" rx="37" fill="#041228" />

      <!-- Top Half of Capsule: Electric Cyan with gloss -->
      <path d="M 213 172 A 37 37 0 0 1 287 172 L 287 212 L 213 212 Z" 
            fill="url(#electricCyan)" />
      <!-- Top Gloss Curve -->
      <path d="M 226 158 A 24 24 0 0 1 274 158" 
            fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85" />

      <!-- Bottom Half of Capsule: Pure Clinical White -->
      <path d="M 213 212 L 287 212 L 287 252 A 37 37 0 0 1 213 252 Z" 
            fill="url(#whiteGloss)" />

      <!-- Dark Navy Seam Line dividing the capsule -->
      <line x1="212" y1="212" x2="288" y2="212" stroke="#061937" stroke-width="5" />

      <!-- Capsule Outer Stroke -->
      <rect x="213" y="135" width="74" height="154" rx="37" 
            fill="none" stroke="url(#electricCyan)" stroke-width="6" />
    </g>

    <!-- 3. Four Veterinary Paw Pads at the Top of Capsule -->
    <g filter="url(#subtleGlow)">
      <!-- Far Left Toe Pad -->
      <ellipse cx="188" cy="132" rx="13" ry="17" 
               transform="rotate(-36, 188, 132)" 
               fill="url(#electricCyan)" />
      <ellipse cx="188" cy="132" rx="6" ry="9" 
               transform="rotate(-36, 188, 132)" 
               fill="#FFFFFF" opacity="0.6" />

      <!-- Center-Left Toe Pad -->
      <ellipse cx="222" cy="98" rx="14" ry="19" 
               transform="rotate(-12, 222, 98)" 
               fill="url(#electricCyan)" />
      <ellipse cx="222" cy="98" rx="7" ry="11" 
               transform="rotate(-12, 222, 98)" 
               fill="#FFFFFF" opacity="0.7" />

      <!-- Center-Right Toe Pad -->
      <ellipse cx="278" cy="98" rx="14" ry="19" 
               transform="rotate(12, 278, 98)" 
               fill="url(#electricCyan)" />
      <ellipse cx="278" cy="98" rx="7" ry="11" 
               transform="rotate(12, 278, 98)" 
               fill="#FFFFFF" opacity="0.7" />

      <!-- Far Right Toe Pad -->
      <ellipse cx="312" cy="132" rx="13" ry="17" 
               transform="rotate(36, 312, 132)" 
               fill="url(#electricCyan)" />
      <ellipse cx="312" cy="132" rx="6" ry="9" 
               transform="rotate(36, 312, 132)" 
               fill="#FFFFFF" opacity="0.6" />
    </g>

  </g>

  <!-- ========================================== -->
  <!-- RIGHT TYPOGRAPHY: LibDose & Subtitle       -->
  <!-- ========================================== -->
  <g transform="translate(480, 245)">
    <!-- "Lib" in Pure Clinical White -->
    <text x="0" y="0" 
          font-family="'Montserrat', 'Inter', -apple-system, sans-serif" 
          font-weight="900" 
          font-size="142" 
          fill="#FFFFFF" 
          letter-spacing="-1">Lib</text>

    <!-- "Dose" in Electric Cyan with Neon Glow -->
    <text x="215" y="0" 
          font-family="'Montserrat', 'Inter', -apple-system, sans-serif" 
          font-weight="900" 
          font-size="142" 
          fill="url(#electricCyan)" 
          letter-spacing="-1" 
          filter="url(#neonAura)">Dose</text>

    <!-- Subtitle: VETERINARY CLINICAL DECISION SUPPORT • BY LIBVET -->
    <text x="6" y="58" 
          font-family="'Montserrat', 'Inter', sans-serif" 
          font-weight="700" 
          font-size="20" 
          fill="#A4CAED" 
          opacity="0.9" 
          letter-spacing="4.5">VETERINARY CLINICAL DECISION SUPPORT • BY LIBVET</text>

    <!-- Persian Secondary Subtitle for Iranian Formulary Identification -->
    <text x="6" y="94" 
          font-family="'Vazirmatn', Tahoma, sans-serif" 
          font-weight="800" 
          font-size="18" 
          fill="url(#electricCyan)" 
          opacity="0.95" 
          letter-spacing="1">سامانه جامع دارونامه و تصمیم‌یار بالینی دامپزشکی ایران</text>
  </g>

</svg>
